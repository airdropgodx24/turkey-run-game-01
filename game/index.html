<title>Gobble Dash — The Great Thanksgiving Escape</title>
<style>

</style>

<div id="stage">
  <canvas id="game" width="1152" height="648" aria-label="Gobble Dash: guide the turkey through three lanes, jump fences and pumpkins, hide in hay bales, dodge the oven and the carving knife, and outrun the farmer to freedom"></canvas>
</div>
<p id="status" role="status" aria-live="polite"></p>
